<!doctype html>
<html lang="en" class="antialiased">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Now — DRINK STOP</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Anton&family=Permanent+Marker&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mobile-menu.css">
<link rel="stylesheet" href="css/vibe-cart.css">
<link rel="icon" href="wp-content/uploads/2025/10/cropped-favicon-2-192x192.webp">
<style>
@font-face{
      font-family:'DS Display';
      src:url('fonts/drinkstop-display.woff2') format('woff2');
      font-weight:900;font-display:swap;
    }
:root{--green:#00ef02;--green2:#3cf02d;--cream:#fffbe6;--ink:#0a0a0a;--red:#e8202a;--blue:#1f6fd6;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;}
.wrap{min-height:100%;display:flex;flex-direction:column;}
/* header */
.ohead{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:0;}
.ohead .logo{height:44px;width:auto;display:block}
.ohead a.back{font-weight:800;text-decoration:none;color:var(--ink);font-size:14px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:2px solid var(--ink);border-radius:999px;transition:.2s}
.ohead a.back:hover{background:var(--ink);color:var(--cream)}
/* header right cluster: basket + close + menu button (ds-menu, same as the rest of the site) */
.ohead-right{display:flex;align-items:center;gap:14px}
.ohead .mobile-menu-button{width:48px;height:48px;padding:11px;display:flex;flex-direction:column;justify-content:center;gap:6px;border:0;border-radius:50%;background:var(--ink);cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none}
.ohead .mobile-menu-button span{width:100%;height:3px;border-radius:99px;background:var(--cream);display:block}
@media(max-width:480px){.ohead{padding:14px 16px}.ohead-right{gap:10px}.ohead a.back{padding:9px 14px;font-size:13px}}
/* progress */
.prog{padding:0 28px 8px;max-width:900px;margin:0 auto;width:100%}
.prog .bar{height:8px;background:#00000014;border-radius:999px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.prog .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-top:10px}
/* stage */
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px 24px 60px}
.step{width:100%;max-width:900px;animation:pop .4s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
h1.q{font-family:'DS Display','Manrope',sans-serif;font-weight:900;font-size:clamp(32px,6vw,60px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:14px}
p.sub{font-size:clamp(15px,2vw,19px);opacity:.75;max-width:620px;margin-bottom:30px}
/* option cards */
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{position:relative;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:26px 24px;cursor:pointer;transition:.18s;overflow:hidden}
.card:hover{transform:translateY(-4px)}
.card .ct{font-family:'DS Display','Manrope',sans-serif;font-weight:900;text-transform:uppercase;font-size:26px;line-height:1;margin-bottom:8px}
.card .cd{font-size:15px;opacity:.72}
.card .tick{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;opacity:0;transform:scale(.5);transition:.18s}
.card.sel{border-color:var(--green);background:#eafff0;box-shadow:0 10px 0 -4px var(--green)}
.card.sel .tick{opacity:1;transform:scale(1);background:var(--green);border-color:var(--green)}
.flav .swatch{width:44px;height:44px;border-radius:12px;margin-bottom:14px}
/* qty */
.qtyrow{display:flex;align-items:center;gap:16px;margin:8px 0 30px}
.qtybtn{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:26px;font-weight:900;cursor:pointer;transition:.15s;color:var(--ink);-webkit-appearance:none;appearance:none}
.qtybtn:hover{background:var(--ink);color:#fff}
.qtyval{font-family:'DS Display',sans-serif;font-weight:900;font-size:44px;min-width:80px;text-align:center}
.qtyunit{opacity:.6;font-weight:700}
.qtotal{font-size:22px;font-weight:800;margin:-8px 0 26px}
.qtotal b{font-family:'DS Display',sans-serif;font-size:28px}
.qtotal span{opacity:.55;font-weight:700;font-size:16px}
/* inputs */
.field{margin-bottom:18px}
.field label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:3px solid var(--ink);border-radius:14px;background:#fff}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px #00ef0233}
.filedrop{border:3px dashed var(--ink);border-radius:18px;padding:26px;text-align:center;cursor:pointer;background:#fff;transition:.15s}
.filedrop:hover{background:#eafff0;border-color:var(--green)}
.filedrop.has{border-style:solid;border-color:var(--green);background:#eafff0}
.filedrop input{display:none}
.thumb{max-height:160px;border-radius:12px;margin:0 auto 10px;display:block}
/* nav buttons */
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px;max-width:900px}
.nav-left{display:flex;gap:14px;align-items:center}
.nav-right{display:flex;gap:14px;align-items:center}
.btn{font:inherit;font-weight:800;font-size:16px;letter-spacing:.02em;padding:16px 34px;border-radius:999px;border:3px solid var(--ink);cursor:pointer;transition:.18s;text-transform:uppercase;color:var(--ink);-webkit-appearance:none;appearance:none;white-space:nowrap}
@media(max-width:480px){.btn{padding:14px 22px;font-size:15px}}
.btn.prev{background:transparent}
.btn.prev:hover{background:var(--ink);color:#fff}
.btn.next{background:var(--green);border-color:var(--green)}
.btn.next:hover{filter:brightness(.92);transform:translateX(3px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;filter:none!important}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:8px;min-height:18px}
/* persistent order summary */
.order-summary{display:none;position:sticky;top:24px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px 22px;font-size:14px}
.order-summary h3{font-family:'DS Display',sans-serif;font-weight:900;text-transform:uppercase;font-size:18px;margin-bottom:14px;letter-spacing:-.01em}
.os-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #00000012;font-size:13px}
.os-row:last-of-type{border-bottom:none}
.os-row .os-k{opacity:.6;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.os-row .os-v{font-weight:800;text-align:right}
.os-total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;padding-top:10px;border-top:2px solid var(--ink)}
.os-total strong{font-family:'DS Display',sans-serif;font-size:24px}
.os-note{font-size:11px;opacity:.55;margin-bottom:6px;line-height:1.4}
.os-vibe{border:2px dashed var(--green);border-radius:14px;padding:12px;margin-bottom:14px;background:#eafff0;font-size:12px}
.os-vibe strong{display:block;margin-bottom:4px;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.os-vibe span{opacity:.7}
/* desktop: two-column stage layout */
@media(min-width:800px){
  .stage{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:flex-start;padding:24px 28px 60px;max-width:1200px;margin:0 auto;width:100%}
  .step{max-width:none;width:100%}
  .order-summary{display:block}
  .prog{margin:0 auto;max-width:1200px;padding:0 28px 8px}
}
/* mobile: sticky nav bar at bottom */
@media(max-width:799px){
  .stage{flex-direction:column;align-items:stretch;padding:24px 16px max(120px,calc(env(safe-area-inset-bottom) + 100px))}
  .nav{position:fixed;bottom:0;left:0;right:0;margin:0;padding:12px 16px;background:var(--cream);border-top:2px solid var(--ink);z-index:100;border-radius:0}
  .nav-left .btn.prev{padding:12px 16px;font-size:14px}
  .nav-right .btn.next{padding:12px 20px;font-size:14px;flex:1}
  .order-summary{display:none}
  /* mobile floating total chip */
  .nav-total{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;text-transform:uppercase;white-space:nowrap;margin-right:8px}
  .nav-total b{font-family:'DS Display',sans-serif;font-size:20px;margin-left:4px}
}
@media(min-width:800px){.nav-total{display:none}}
/* vibe basket banner on intro */
.vibe-banner{border:2px solid var(--green);border-radius:18px;padding:20px;margin-bottom:28px;background:#eafff0}
.vibe-banner .pill{background:var(--green);color:var(--ink)}
.vibe-items{margin:12px 0;display:flex;flex-direction:column;gap:8px}
.vibe-item{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:6px 0;border-bottom:1px solid #00000012}
.vibe-item:last-child{border-bottom:0}
.vibe-item span{opacity:.65;font-weight:400}
.vibe-actions{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
/* summary + done */
.summary{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:24px 26px}
.summary .row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #00000012}
.summary .row:last-child{border-bottom:0}
.summary .k{font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.06em;opacity:.6}
.summary .v{text-align:right;font-weight:700}
.done{text-align:center;padding:20px 0}
.done .big{font-family:'DS Display',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(40px,9vw,86px);line-height:.9}
.done .check{width:96px;height:96px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:52px}
.foot{text-align:center;padding:16px;font-size:12px;font-weight:700;letter-spacing:.05em;opacity:.5;text-transform:uppercase}
.pill{display:inline-block;background:var(--ink);color:var(--cream);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:14px}
/* intro pouch row */
.pouch-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin:8px 0 34px;}
.pouch-row__img{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.18));opacity:0;animation:pouchBounceIn .7s cubic-bezier(.34,1.56,.64,1) forwards;}
@media(max-width:640px){.pouch-row__img{width:64px;height:64px}}
@keyframes pouchBounceIn{
  0%{opacity:0;transform:translateY(40px) scale(.5);}
  60%{opacity:1;transform:translateY(-8px) scale(1.06);}
  80%{transform:translateY(3px) scale(.98);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
/* mix & match builder */
.mixbuild{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:22px 24px;margin-bottom:22px}
.mb-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #00000012}
.mb-row:first-child{padding-top:0}
.mb-label{font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;opacity:.65;min-width:90px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.segbtn{font:inherit;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;transition:.15s;-webkit-appearance:none;appearance:none}
.segbtn.on{background:var(--ink);color:#fff}
.segbtn:hover{transform:translateY(-1px)}
.mb-price{font-weight:800;font-size:16px;margin-top:14px}
.mb-price span{opacity:.6;font-weight:700;font-size:13px;display:block;margin-top:2px}
.mixlist{margin-bottom:18px}
.mixrow{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.mixrow-info{flex:1;font-weight:700;font-size:14px}
.mixrow-sub{font-weight:800;font-size:16px;white-space:nowrap}
.mixrow-x{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;font-weight:900;color:var(--ink);flex-shrink:0;-webkit-appearance:none;appearance:none}
.mixrow-x:hover{background:var(--red);color:#fff;border-color:var(--red)}

/* ===== PARTY INTRO REDESIGN (Step 1 / intro step only) ===== */
.party-headline{position:relative;font-family:'Anton','DS Display',sans-serif;font-weight:400;font-size:clamp(44px,7vw,92px);line-height:.88;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:6px}
.party-headline em{color:var(--red);font-style:normal}
.party-headline .ph-m{display:none}
.party-underline{display:block;width:min(260px,60%);height:12px;margin:6px 0 18px 4px;border-top:6px solid var(--ink);border-radius:50%;transform:rotate(-3deg)}
.party-sub{font-size:clamp(15px,2vw,19px);opacity:.75;max-width:520px;margin-bottom:26px}
.party-benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;list-style:none;margin:0 0 30px;padding:0}
.party-benefit{min-width:0;text-align:center}
.party-benefit i{width:52px;height:52px;margin:0 auto 8px;padding:13px;border-radius:50%;display:grid;place-items:center;background:var(--ink);box-shadow:0 8px 18px rgba(0,0,0,.15)}
.party-benefit i img{width:100%;height:100%;filter:brightness(0) invert(1)}
.party-benefit strong{display:block;color:var(--red);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.party-benefit small{display:block;margin-top:3px;color:#4c493f;font-size:10px;line-height:1.25}
.party-hand{font-family:'Permanent Marker',cursive;line-height:.95;transform:rotate(-2deg);margin:0 0 16px 8px}
.party-hand p{margin:0;font-size:22px}
.party-hand strong{display:block;margin-top:2px;color:var(--red);font-size:19px;text-transform:uppercase}
.party-cards{display:grid;gap:16px;margin-bottom:20px}
.party-card{position:relative;isolation:isolate;overflow:hidden;min-height:230px;border-radius:28px;display:grid;grid-template-columns:44% 56%;box-shadow:0 18px 46px rgba(17,17,17,.16)}
.party-card::after{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;border:1px solid rgba(255,255,255,.24);border-radius:inherit}
.party-card--red{color:#fff;background:linear-gradient(135deg,#ff414b 0%,#ed1c24 50%,#c90016 100%)}
.party-card--yellow{color:var(--ink);background:linear-gradient(135deg,#ffd943 0%,#ffc400 52%,#f3a900 100%)}
.party-card--green{color:#fff;background:linear-gradient(135deg,#4cc26a 0%,#258f3a 52%,#145423 100%)}
.party-card--blue{color:#fff;background:linear-gradient(135deg,#4c8dff 0%,#1457e6 52%,#0d3aa6 100%)}
.party-card--purple{color:#fff;background:linear-gradient(135deg,#6b3fae 0%,#30106b 52%,#1d0940 100%)}
/* drink-matched vibe card: the drink's own background asset + accent colour.
   --vibe-bg-d / --vibe-bg-m are set inline per card; mobile asset swaps in under 800px. */
.party-card--vibe{color:var(--ink);background-color:var(--cream)}
.party-card--vibe::before{content:"";position:absolute;inset:0;z-index:0;background-image:var(--vibe-bg-d);background-size:cover;background-position:center}
.party-card--vibe .party-card-art,.party-card--vibe .party-card-content{z-index:1}
/* frosted cream chip behind the copy (same treatment as the vibe page's own chips)
   keeps name/price readable where the background's edge decorations reach the centre */
.party-card--vibe .party-card-content{align-self:center;margin:14px 16px 14px 0;padding:16px 18px 14px;border-radius:18px;background:rgba(255,251,230,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(42,31,6,.14)}
.party-card--vibe .party-card-eyebrow{color:var(--vibe-accent,var(--red));opacity:1}
.party-card-art{position:relative;min-width:0;overflow:hidden}
.party-card-fruit,.party-card-prop,.party-card-pouch{position:absolute}
.party-card-fruit--a{width:58%;left:-8%;bottom:-4%;z-index:2;transform:rotate(-8deg);opacity:.92}
.party-card-fruit--b{width:32%;right:-2%;bottom:2%;z-index:5;transform:rotate(10deg);opacity:.92}
.party-card-prop{width:26%;right:2%;top:9%;z-index:1;opacity:.7;transform:rotate(9deg)}
.party-card-pouch{z-index:4;width:56%;height:88%;left:26%;bottom:0;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 16px 12px rgba(0,0,0,.28))}
.party-card-content{min-width:0;padding:22px 22px 20px 4px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.party-card-eyebrow{margin:0 0 4px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.party-card-content h3{margin:0;font-family:'Anton','DS Display',sans-serif;font-weight:400;font-size:clamp(28px,3vw,40px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase}
.party-card-flavour{margin:7px 0 14px;font-size:12px;line-height:1.3;font-weight:800;text-transform:uppercase}
.party-qty{min-width:126px;height:44px;padding:0 6px;border-radius:999px;display:grid;grid-template-columns:38px 44px 38px;align-items:center;background:var(--ink);color:#fff}
.party-qty button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:16px;font-weight:900;cursor:pointer;-webkit-appearance:none;appearance:none}
.party-qty button:hover{background:rgba(255,255,255,.18)}
.party-qty output{text-align:center;font-weight:900;font-size:18px}
.party-card-footer{width:100%;margin-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.party-card-meta{font-size:13px;font-weight:700}
.party-card-price{font-family:'Anton','DS Display',sans-serif;font-weight:400;font-size:27px;line-height:1}
.party-cta{width:100%;min-height:70px;margin-top:4px;padding:0 28px;border:4px solid var(--green);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:20px;color:var(--green);background:var(--ink);box-shadow:0 14px 28px rgba(0,0,0,.2);font-family:'Anton','DS Display',sans-serif;font-weight:400;font-size:clamp(22px,3vw,34px);letter-spacing:.01em;text-transform:uppercase;cursor:pointer;transition:.2s var(--ui,ease);-webkit-appearance:none;appearance:none}
.party-cta:hover{transform:translateY(-3px)}
.party-cta img{width:32px;height:32px;filter:invert(89%) sepia(96%) saturate(1810%) hue-rotate(18deg) brightness(106%) contrast(105%)}
.party-secondary{display:flex;align-items:center;gap:8px;width:max-content;margin:16px auto 0;padding:11px 24px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s;-webkit-appearance:none;appearance:none}
.party-secondary:hover{background:var(--ink);color:var(--cream)}
/* poof removal — minus on the last pouch of a drink */
.party-card--poof{animation:cardPoof .42s cubic-bezier(.5,0,.7,.4) forwards;pointer-events:none}
@keyframes cardPoof{0%{opacity:1;transform:scale(1)}25%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(.55) rotate(-4deg)}}
.poof-puff{position:fixed;z-index:200;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,251,230,.95) 0%,rgba(255,251,230,.55) 45%,rgba(255,251,230,0) 70%);animation:puffUp .45s ease-out forwards}
@keyframes puffUp{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.poof-crumb{position:fixed;z-index:201;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;animation:crumbFly var(--d,.4s) ease-out forwards}
@keyframes crumbFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* black "Your Party" summary — only rendered while the intro step has vibe items */
.order-summary.party{background:var(--ink);color:#fff;border:0;padding:0;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.25)}
.party-summary-inner{padding:26px}
.party-summary-inner h3{font-family:'Anton','DS Display',sans-serif;font-weight:400;font-size:30px;line-height:1;text-transform:uppercase;margin-bottom:8px}
.party-summary-marker{display:block;width:150px;height:7px;margin-bottom:18px;background:var(--green);border-radius:50%;transform:rotate(-2deg)}
.party-sum-benefits{margin:0 0 18px;padding:0;list-style:none;display:grid}
.party-sum-benefits li{min-height:58px;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.2);display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center}
.party-sum-benefit-icon{width:36px;height:36px;padding:8px;border-radius:50%;display:grid;place-items:center;background:rgba(60,240,45,.14)}
.party-sum-benefit-icon img{width:100%;height:100%;filter:invert(89%) sepia(96%) saturate(1810%) hue-rotate(18deg) brightness(106%) contrast(105%)}
.party-sum-benefits strong{display:block;font-size:12px;text-transform:uppercase}
.party-sum-benefits small{display:block;margin-top:2px;color:rgba(255,255,255,.65);font-size:10px}
.party-sum-lines{display:grid}
.party-sum-line{min-height:60px;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.2);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
.party-sum-line strong{display:block;font-weight:900;text-transform:uppercase}
.party-sum-line small{display:block;margin-top:2px;color:rgba(255,255,255,.65);font-size:11px}
.party-sum-line b{font-weight:800;white-space:nowrap}
.party-sum-total{padding:18px 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.party-sum-total span{color:var(--green);font-size:13px;font-weight:900;text-transform:uppercase}
.party-sum-total strong{font-family:'Anton','DS Display',sans-serif;font-weight:400;font-size:38px;line-height:.9}
.party-checkout-btn{width:100%;min-height:54px;margin-top:14px;padding:0 18px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--ink);background:var(--green);font-size:13px;font-weight:900;text-transform:uppercase;cursor:pointer;transition:transform .16s ease;-webkit-appearance:none;appearance:none}
.party-checkout-btn:hover{transform:translateY(-2px)}
.party-checkout-btn img{width:20px;height:20px}
.party-secure{margin:12px 0 0;display:flex;align-items:center;justify-content:center;gap:7px;color:rgba(255,255,255,.6);font-size:11px}
.party-secure img{width:14px;height:14px;filter:brightness(0) invert(1);opacity:.66}
@media(max-width:799px){
  /* headline: centred, two lines; sub copy: centred + bold */
  .party-headline{text-align:center}
  .party-headline .ph-d{display:none}
  .party-headline .ph-m{display:inline}
  /* keep the 2-line split intact on very small phones (Galaxy Fold etc.) */
  @media(max-width:340px){.party-headline{font-size:42px}}
  .party-underline{margin-left:auto;margin-right:auto}
  .party-sub{text-align:center;font-weight:700;margin-left:auto;margin-right:auto}
  .party-benefits{gap:6px;margin-bottom:24px}
  .party-benefit i{width:44px;height:44px;padding:11px}
  .party-benefit small{max-width:70px;margin:3px auto 0}
  .party-card--vibe::before{background-image:var(--vibe-bg-m)}
  .party-card--vibe .party-card-content{margin:10px 12px 10px 0;padding:12px 14px 10px}
  .party-card{min-height:180px;border-radius:22px}
  .party-card-content{padding:16px 14px 14px 0}
  .party-card-content h3{font-size:clamp(22px,7vw,30px)}
  .party-card-price{font-size:21px}
  .party-cta{min-height:60px;gap:14px;font-size:clamp(18px,6vw,26px)}
  .order-summary.party{display:block;margin-top:22px;position:static}
}
</style>

<script>
const INTRO_DRINK_IDS=[
  ['rum-for-your-life','Rum For Your Life'],
  ['rumbaclart-2','Rumbaclart 2.0'],
  ['rumbaclart-1','Rumbaclart 1.0'],
  ['summer-set','Summer Set'],
  ['blutiful','Blutiful'],
  ['rumazing','Rumazing'],
  ['suck-your-rum','Suck Your Rum'],
];
// one bottle + one pouch shot per flavour, so the intro row shows the full range
const INTRO_POUCHES=INTRO_DRINK_IDS.flatMap(([id,name])=>[
  {src:'wp-content/uploads/2026/07/vibe/bottle-'+id+'.webp',alt:name+' bottle'},
  {src:'wp-content/uploads/2026/07/vibe/product-'+id+'.png',alt:name+' pouch'},
]);
const PARTY_ICON='assets/party/icons/', PARTY_DECOR='assets/party/decor/';
const PARTY_THEMES=[
  {cls:'red',    fruitA:PARTY_DECOR+'watermelon.svg',   fruitB:PARTY_DECOR+'strawberry.svg',   prop:PARTY_DECOR+'disco-ball.svg'},
  {cls:'yellow', fruitA:PARTY_DECOR+'pineapple.svg',     fruitB:PARTY_DECOR+'passionfruit.svg', prop:PARTY_DECOR+'speaker.svg'},
  {cls:'green',  fruitA:PARTY_DECOR+'pineapple.svg',     fruitB:PARTY_DECOR+'strawberry.svg',   prop:PARTY_DECOR+'record.svg'},
  {cls:'blue',   fruitA:PARTY_DECOR+'watermelon.svg',    fruitB:PARTY_DECOR+'passionfruit.svg', prop:PARTY_DECOR+'disco-ball.svg'},
  {cls:'purple', fruitA:PARTY_DECOR+'pineapple.svg',     fruitB:PARTY_DECOR+'strawberry.svg',   prop:PARTY_DECOR+'speaker.svg'},
];
function partyTheme(i){ return PARTY_THEMES[i % PARTY_THEMES.length]; }
// per-drink accent colours — keep in sync with the drinks data on choose-your-vibe.html.
// background asset paths are derived from the drink id, same convention as partyPouchSrc.
const VIBE_ASSET='wp-content/uploads/2026/07/vibe';
const VIBE_DRINK_ACCENTS={
  'rumbaclart-2':'#2B8E2D',
  'rum-for-your-life':'#E9040D',
  'suck-your-rum':'#33076C',
  'blutiful':'#1457E6',
  'rumbaclart-1':'#FC6801',
  'rumazing':'#E5007D',
  'summer-set':'#E9040D',
};
// match a vibe basket item to its own background + accent; null if the drink is unknown
// (callers then fall back to the generic partyTheme gradients).
function vibeTheme(item){
  const accent=item && VIBE_DRINK_ACCENTS[item.id];
  if(!accent) return null;
  return {accent:accent,
    desktop:VIBE_ASSET+'/background-desktop-'+item.id+'.webp',
    mobile:VIBE_ASSET+'/background-mobile-'+item.id+'.webp'};
}
function partyPouchSrc(item){
  return item.format==='bottle'
    ? 'wp-content/uploads/2026/07/vibe/bottle-'+item.id+'.webp'
    : 'wp-content/uploads/2026/07/vibe/product-'+item.id+'.png';
}
const FLAVOURS=[
  {id:'run',name:'Rum For Your Life',desc:'Rum, fruit punch & watermelon',color:'#e8202a'},
  {id:'suck',name:'Suck Your Rum',desc:'Rum, apple, lemon & ginger',color:'#f2b200'},
  {id:'rumba',name:'Rumbaclart 2.0',desc:'Pineapple, apple & guava',color:'#3cc24a'},
];
const MOCKTAIL_FLAVOURS=[
  {id:'m-watermelon-pineapple',name:'Watermelon & Pineapple',desc:'Watermelon and pineapple',color:'#e8202a'},
  {id:'m-lemon-apple',name:'Lemon & Apple',desc:'Lemon and apple',color:'#f2b200'},
  {id:'m-apple-mango',name:'Apple & Mango',desc:'Apple and mango',color:'#FD6B01'},
  {id:'m-blue-raspberry',name:'Blue Raspberry, Apple & Lemon',desc:'Blue raspberry, apple and lemon',color:'#1f6fd6'},
  {id:'m-ginger-apple-lemon',name:'Ginger, Apple & Lemon',desc:'Ginger, apple and lemon',color:'#3cc24a'},
];
function currentFlavourList(){ return S.type==='mocktail' ? MOCKTAIL_FLAVOURS : FLAVOURS; }
let PRICING={original:{alcohol:{150:5,250:8},mocktail:{150:3,250:4}},custom:{alcohol:{150:6,250:9},mocktail:{150:4,250:5}}};
let CUSTOM_DESIGN_FEE_NOTE='from £30 (confirmed on request)';
// TODO(supabase): once wired up, PRICING/CUSTOM_DESIGN_FEE_NOTE should be fetched from Supabase
// instead of the localStorage-backed admin-content.json flow below.
document.addEventListener('drinkstop:content-applied', e => {
  const data = e.detail;
  if (data && data.pricing) {
    PRICING = { original: data.pricing.original, custom: data.pricing.custom };
    CUSTOM_DESIGN_FEE_NOTE = data.pricing.customDesignFeeNote || CUSTOM_DESIGN_FEE_NOTE;
    render();
  }
});
function unitPrice(design,type,size){const d=design==='custom'?'custom':'original';return PRICING[d][type||'alcohol'][size||150];}
function price(){return unitPrice(S.design,S.type,S.size);}
// mix items carried over from the vibe page keep their own price (per-flavour, may include multi-buy discount)
// so they don't silently change price when they land in the generic mix builder.
function mixUnitPrice(it){ return it.fixedPrice!=null ? it.fixedPrice : unitPrice(it.design,it.type,it.size); }
function mixItemLabel(it){ return (it.name?it.name+' · ':'')+`${it.qty}x ${it.type==='mocktail'?'Mocktail':'Alcohol'} · ${it.packaging==='bottle'?'Bottle':'Pouch'} · ${it.size}ml${it.design==='custom'?' · Custom design':''}`; }
const S={design:null, type:null, size:null, flavours:[], qty:5, occasion:'', customFlavours:[], artwork:null, artworkName:'', brief:'', designMode:null, name:'', email:'', phone:'', area:'',
  mix:[], mixCur:{type:'alcohol',packaging:'pouch',design:'original',size:150,qty:5}, vibeBasket:[]};
let idx=0;

// build the ordered list of step-keys based on branch (no more 'choose' fork)
function sequence(){
  const base=['intro','design','type','size'];
  if(S.design==='original') return [...base,'flavours','qty','details','review','done'];
  if(S.design==='custom')   return [...base,'occasion','customflav','qtyc','artwork','details','review','done'];
  if(S.design==='mix')      return ['intro','design','mixbuilder','details','review','done'];
  return base;
}
const el=document.getElementById('step');

function render(keepScroll){
  const seq=sequence(); const key=seq[idx];
  el.innerHTML=STEPS[key]();
  wire(key);
  renderSummary();
  if(!keepScroll) window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ idx=Math.max(0,idx+n); render(); }
function reseq(){ idx=Math.min(idx, sequence().length-1); }

function navHtml(nextLabel, canBack=true, nextId='next', nextDisabled=false){
  return `<div class="nav">
    ${canBack?`<button class="btn prev" id="prev">← Back</button>`:`<span></span>`}
    <button class="btn next" id="${nextId}" ${nextDisabled?'disabled':''}>${nextLabel}</button></div>`;
}

const STEPS={
 intro:()=>{
  const hasVibe=S.vibeBasket.length>0;
  const headline=`
  <h1 class="party-headline"><span class="ph-d">Let's get<br>the <em>party</em><br>started.</span><span class="ph-m">Let's get the<br><em>party</em> started.</span></h1>
  <span class="party-underline" aria-hidden="true"></span>
  <p class="party-sub">You're one step away from frozen cocktails delivered your way. In a hurry? Try the <a href="quick-order.html" style="color:inherit">quick order form</a> instead.</p>`;

  if(!hasVibe){
    return headline+`
    <div class="pouch-row" id="introPouches">
      ${INTRO_POUCHES.map((p,i)=>'<img src="'+p.src+'" alt="'+p.alt+'" class="pouch-row__img" style="animation-delay:'+(i*0.09)+'s">').join('')}
    </div>
    ${navHtml('Start →', true)}`;
  }

  const cards=S.vibeBasket.map((item,i)=>{
    const vt=vibeTheme(item);
    const t=vt?null:partyTheme(i);
    // drink-matched cards use the drink's own background asset, so the fruit/prop SVG
    // decorations are baked in — only the pouch shot goes on top. Unknown drinks keep
    // the old gradient + SVG decor treatment.
    const art=(vt?'':
      `<img class="party-card-fruit party-card-fruit--a" src="${t.fruitA}" alt="">
       <img class="party-card-fruit party-card-fruit--b" src="${t.fruitB}" alt="">
       <img class="party-card-prop" src="${t.prop}" alt="">`)
      +`<img class="party-card-pouch" src="${partyPouchSrc(item)}" alt="${esc(item.name)}">`;
    const cls=vt?'party-card--vibe':'party-card--'+t.cls;
    const style=vt?` style="--vibe-accent:${vt.accent};--vibe-bg-d:url('${vt.desktop}');--vibe-bg-m:url('${vt.mobile}')"`:'';
    return `
    <article class="party-card ${cls}" data-vibe-idx="${i}"${style}>
      <div class="party-card-art" aria-hidden="true">${art}</div>
      <div class="party-card-content">
        <div>
          <p class="party-card-eyebrow">Frozen rum cocktail</p>
          <h3>${esc(item.name)}</h3>
        </div>
        <div class="party-qty" role="group" aria-label="${esc(item.name)} quantity">
          <button type="button" data-vqty="-1" data-idx="${i}" aria-label="Remove one ${esc(item.name)}">−</button>
          <output aria-live="polite">${item.qty}</output>
          <button type="button" data-vqty="1" data-idx="${i}" aria-label="Add one ${esc(item.name)}">+</button>
        </div>
        <div class="party-card-footer">
          <span class="party-card-meta">${item.qty} × ${item.size}ml</span>
          <strong class="party-card-price">£${(item.unitPrice*item.qty).toFixed(2)}</strong>
        </div>
      </div>
    </article>`;
  }).join('');

// poof: smoke puff + crumbs burst, then the card shrinks away
function poofCard(card,done){
  if(!card || window.matchMedia('(prefers-reduced-motion: reduce)').matches){done();return;}
  const r=card.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, size=Math.max(r.width,130);
  const puff=document.createElement('div');
  puff.className='poof-puff';
  puff.style.cssText=`left:${cx}px;top:${cy}px;width:${size}px;height:${size}px`;
  document.body.appendChild(puff);
  for(let n=0;n<8;n++){
    const c=document.createElement('i');
    c.className='poof-crumb';
    const ang=(n/8)*Math.PI*2+Math.random()*.6, dist=60+Math.random()*80;
    c.style.cssText=`left:${cx}px;top:${cy}px;background:${n%2?'var(--green)':'var(--ink)'};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;--d:${(.35+Math.random()*.3).toFixed(2)}s`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),850);
  }
  card.classList.add('party-card--poof');
  setTimeout(()=>{puff.remove();done();},430);
}

async function submitOrder(){
  const body=orderText();
  try {
    const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:S,summary:body,timestamp:new Date().toISOString(),source:window.location.href})});
    const data=await r.json();
    if(r.ok&&data.success){ SENT_OK=true; return; }
    throw new Error(data.error||'API error');
  } catch(e){ /* server not wired yet — mailto fallback available on done screen */ }
}

function wire(key){
  const prev=document.getElementById('prev'); if(prev) prev.onclick=()=>go(-1);
  const next=document.getElementById('next'); if(next) next.onclick=()=>{ if(!validate(key))return; go(1); };
  if(key==='design') el.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{S.design=c.dataset.d; S.qty=5; S.type=null; S.size=null; reseq();render();});
  if(key==='type') el.querySelectorAll('[data-t]').forEach(c=>c.onclick=()=>{S.type=c.dataset.t;render();});
  if(key==='size') el.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{S.size=parseInt(c.dataset.s);render();});
  if(key==='mixbuilder'){
    el.querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>{const k=b.dataset.cur; S.mixCur[k]=(k==='size')?parseInt(b.dataset.v):b.dataset.v; render();});
    el.querySelectorAll('[data-curq]').forEach(b=>b.onclick=()=>{const step=parseInt(b.dataset.curq); S.mixCur.qty=Math.max(1,S.mixCur.qty+step); document.getElementById('curqv').textContent=S.mixCur.qty;});
    const addBtn=document.getElementById('addmix'); if(addBtn) addBtn.onclick=()=>{S.mix.push({...S.mixCur}); S.mixCur={...S.mixCur, qty:5}; render();};
    el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.mix.splice(parseInt(b.dataset.rm),1); render();});
  }
  if(key==='flavours') el.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{toggle(S.flavours,c.dataset.f);render();});
  if(key==='customflav') el.querySelectorAll('[data-cf]').forEach(c=>c.onclick=()=>{toggle(S.customFlavours,c.dataset.cf);render();});
  if(key==='occasion') el.querySelectorAll('[data-o]').forEach(c=>c.onclick=()=>{S.occasion=c.dataset.o;render();});
  if(key==='qty'||key==='qtyc'){el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const min=5,step=parseInt(b.dataset.q); S.qty=Math.max(min,(S.qty<min?min:S.qty)+step); document.getElementById('qv').textContent=S.qty; const qt=document.getElementById('qtotal'); if(qt)qt.textContent='£'+(S.qty*price());});}
  if(key==='artwork'){el.querySelectorAll('[data-dm]').forEach(c=>c.onclick=()=>{S.designMode=c.dataset.dm;render();}); dmPanel(); updateNext();}
  if(key==='intro'){
    // idx is already 0 here, so the generic go(-1) prev wiring above is a no-op —
    // send the very first step's back button out of the wizard instead.
    const introPrev=document.getElementById('prev');
    if(introPrev) introPrev.onclick=()=>{ history.back(); };
    const vf=document.getElementById('vibeFresh'); if(vf) vf.onclick=()=>{
      S.vibeBasket=[]; localStorage.removeItem('drinkstop_vibe_basket'); idx=0; render();
    };
    el.querySelectorAll('[data-vqty]').forEach(b=>b.onclick=()=>{
      const i=parseInt(b.dataset.idx), delta=parseInt(b.dataset.vqty);
      const item=S.vibeBasket[i]; if(!item) return;
      // minus on the last one of this drink: poof it off the list instead of going below 1
      if(delta<0 && (parseInt(item.qty)||1)<=1){
        poofCard(b.closest('.party-card'),()=>{
          const at=S.vibeBasket.indexOf(item);
          if(at>=0) S.vibeBasket.splice(at,1);
          try{
            if(S.vibeBasket.length) localStorage.setItem('drinkstop_vibe_basket',JSON.stringify(S.vibeBasket));
            else localStorage.removeItem('drinkstop_vibe_basket');
          }catch(e){}
          render(true);
        });
        return;
      }
      item.qty=Math.max(1,(parseInt(item.qty)||1)+delta);
      try{ localStorage.setItem('drinkstop_vibe_basket', JSON.stringify(S.vibeBasket)); }catch(e){}
      render(true);
    });
  }
  if(key==='details'){['name','email','phone','area'].forEach(k=>{const i=document.getElementById('f_'+k); if(i)i.oninput=e=>S[k]=e.target.value;});}
  if(key==='review'){const pl=document.getElementById('place'); if(pl)pl.onclick=async()=>{await submitOrder(); go(1);};}
}
function toggle(arr,v){const i=arr.indexOf(v); if(i<0)arr.push(v); else arr.splice(i,1);}
function validate(key){
  if(key==='details'){const err=document.getElementById('err');
    if(!S.name.trim()){err.textContent='Pop your name in.';return false;}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email)){err.textContent='Need a valid email to confirm.';return false;}
    err.textContent='';}
  if(key==='artwork') return artworkValid();
  if(key==='mixbuilder'){ const totalQty=S.mix.reduce((sum,it)=>sum+it.qty,0); if(totalQty<5){ const err=document.getElementById('err'); if(err)err.textContent='Minimum 5 pouches total across your mix.'; return false; } }
  return true;
}

// load vibe basket from choose-your-vibe page
(function(){
  try {
    const raw=localStorage.getItem('drinkstop_vibe_basket');
    if(raw){const items=JSON.parse(raw); if(Array.isArray(items)&&items.length) S.vibeBasket=items;}
  } catch(e){}
})();

// Close returns to the vibe page (the "Order Now" page) — the same view the
// menu's Order Now link opens. The basket is persisted in localStorage, so the
// cart badge/total is right there when the party continues.
const closeLink=document.getElementById('closeLink');
if(closeLink) closeLink.addEventListener('click',e=>{
  e.preventDefault();
  window.location.href='choose-your-vibe.html';
});

render();
</script>
