<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="#00C1B2">
  <!-- Deliveroo Kangaroo -->
  <g transform="translate(10, 10)">
    <!-- Body -->
    <ellipse cx="50" cy="50" rx="30" ry="28" fill="#00C1B2"/>
    <!-- Head -->
    <circle cx="72" cy="30" r="16" fill="#00C1B2"/>
    <!-- Ear -->
    <ellipse cx="68" cy="14" rx="6" ry="10" fill="#00C1B2" transform="rotate(-15, 68, 14)"/>
    <!-- Tail -->
    <path d="M22 55 C8 50 4 40 6 30 C8 24 12 26 10 32 C8 38 12 46 22 48 Z" fill="#00C1B2"/>
    <!-- Eye -->
    <circle cx="78" cy="28" r="3" fill="#fff"/>
    <!-- Nose -->
    <circle cx="86" cy="32" r="2.5" fill="#101010"/>
  </g>
</svg>
