<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="#E30613">
  <!-- AFTV logo -->
  <g transform="translate(25, 20)">
    <!-- TV shape -->
    <rect x="0" y="0" width="100" height="60" rx="6" fill="#E30613"/>
    <rect x="5" y="5" width="90" height="50" rx="3" fill="#101010"/>
    <!-- AFTV text -->
    <text font-family="'Arial Black', 'Impact', sans-serif" font-size="26" font-weight="900" fill="#fff" x="16" y="40">AFTV</text>
    <!-- Antenna -->
    <rect x="42" y="-8" width="6" height="8" fill="#E30613"/>
    <circle cx="45" cy="-12" r="5" fill="#E30613"/>
    <!-- Stand -->
    <path d="M25 60 L40 75 L55 60" fill="none" stroke="#E30613" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
